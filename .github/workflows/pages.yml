name: Deploy Immersive Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install dependencies
        run: npm install
      - name: Validate
        run: |
          npm run build
          node --check src/room.js
          test -s dist/index.html
          grep -q 'world' dist/index.html
          if grep -R -E 'cdn.jsdelivr.net|unpkg.com|esm.sh' src dist; then exit 1; fi
          if grep -q 'bottom-nav' index.html; then exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Browser smoke
        timeout-minutes: 5
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/Jarvis-Apk/ >/dev/null && break; sleep 1; done
          SITE_URL=http://127.0.0.1:4173/Jarvis-Apk/ node scripts/runtime_smoke.cjs
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-smoke
          path: room-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@0ca16172ca884f0a37117fed41734f29784cc980
        with:
          path: dist
  deploy:
    needs: build-test-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify deployment response
        run: |
          curl -fsSL "${{ steps.deployment.outputs.page_url }}" -o "$RUNNER_TEMP/live.html"
          grep -q 'world' "$RUNNER_TEMP/live.html"
