name: Deploy JARVIS PRO Storefront to GitHub Pages
# Retry after repository Pages source was manually set to GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate storefront files
        run: |
          test -s index.html
          grep -q 'JARVIS PRO' index.html
          grep -q '₹19' index.html
          grep -q 'id="core"' index.html
          grep -q 'INTERACTIVE LAB' index.html
          grep -q 'demoscreen' index.html
          grep -q 'FAQ' index.html
          grep -q 'pointermove' index.html
          grep -q 'id="story"' index.html
          grep -q 'id="dropzone"' index.html
          grep -q 'dragstart' index.html
          grep -q 'chapterrail' index.html
          grep -q 'scroll-p' index.html
          grep -q 'id="setup"' index.html
          grep -q 'setup-station' index.html
          grep -q 'id="devicefamily"' index.html
          grep -q 'id="setup-progress-bar"' index.html
          grep -q 'class="step-done"' index.html
          grep -q 'Do not disable Play Protect' index.html
          grep -q 'does not recommend bypassing' index.html
          grep -q 'support.google.com/android/answer/12623953' index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          anchors = re.findall(r'href="#([^"]+)"', html)
          broken = sorted(set(x for x in anchors if x not in ids))
          setup = html[html.index('<section id="setup"'):html.index('<section id="pricing"')]
          steps = len(re.findall(r'<article class="setup-step', setup))
          if duplicates or broken or steps != 8:
              print(f"Duplicate IDs: {duplicates}; broken anchors: {broken}; setup steps: {steps}")
              raise SystemExit(1)
          print(f"Static audit passed: {len(ids)} IDs, {len(anchors)} anchors, {steps} setup steps.")
          PY
      - name: Validate JavaScript and cinematic interactions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/storefront.js").write_text(scripts[0])
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          js_ids = set(re.findall(r"getElementById\('([^']+)'\)", scripts[0]))
          missing = sorted(js_ids - ids)
          if missing:
              raise SystemExit(f"JS references missing HTML IDs: {missing}")
          checks = {
              "cinematic canvas": 'id="scene-canvas"' in html,
              "scene label": 'id="scene-label"' in html,
              "scene caption": 'id="scene-caption"' in html,
              "sound control": 'id="sound-toggle"' in html,
              "sound defaults off": 'aria-pressed="false"' in html,
              "reduced-motion support": "prefers-reduced-motion:reduce" in html or "prefers-reduced-motion: reduce" in html,
              "setup guide": 'id="setup"' in html,
              "8 setup articles": len(re.findall(r'<article class="setup-step', html)) == 8,
              "no autoplay audio": not re.search(r'<audio[^>]*autoplay', html, re.I),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Interaction checks failed: " + ", ".join(failed))
          print("JavaScript selectors and cinematic checks passed.")
          PY
          node --check /tmp/storefront.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path("index.html").read_text().split("<style>", 1)[1].split("</style>", 1)[0]
          depth = 0
          quote = None
          comment = False
          i = 0
          while i < len(css):
              if comment:
                  if css.startswith("*/", i):
                      comment = False
                      i += 2
                      continue
                  i += 1
                  continue
              if quote:
                  if css[i] == "\\": i += 2; continue
                  if css[i] == quote: quote = None
                  i += 1
                  continue
              if css.startswith("/*", i):
                  comment = True
                  i += 2
                  continue
              if css[i] in ('"', "'"):
                  quote = css[i]
                  i += 1
                  continue
              if css[i] == "{": depth += 1
              elif css[i] == "}":
                  depth -= 1
                  if depth < 0: raise SystemExit("CSS has an unmatched closing brace")
              i += 1
          if comment or quote or depth:
              raise SystemExit(f"CSS balance failed: comment={comment}, quote={quote}, depth={depth}")
          print("CSS structure check passed.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
