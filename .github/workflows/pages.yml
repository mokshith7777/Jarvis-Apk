name: Deploy JARVIS Cinematic Phase 1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate workflow
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/pages.yml
      - name: Validate Phase 1 files and HTML references
        run: |
          test -s index.html
          test -s styles/cinematic.css
          test -s src/main.js
          test -s src/armor.js
          test -s .nojekyll
          grep -q 'cinematic-world' index.html
          grep -q 'importmap' index.html
          grep -q 'ScrollTrigger' src/main.js
          grep -q 'Lenis' src/main.js
          grep -q 'createArmor' src/armor.js
          grep -q 'setExploded' src/armor.js
          grep -q 'ARC_REACTOR_ASSEMBLY' src/armor.js
          grep -q 'loadArmor' src/main.js
          grep -q 'KTX2Loader' src/main.js
          grep -q 'DRACOLoader' src/main.js
          grep -q 'UnrealBloomPass' src/main.js
          grep -q 'BokehPass' src/main.js
          grep -q 'prefers-reduced-motion' styles/cinematic.css
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          class Audit(HTMLParser):
            def __init__(self):
              super().__init__(); self.ids=[]; self.tags=[]; self.errors=[]
            def handle_starttag(self,t,attrs):
              a=dict(attrs); self.tags.append(t)
              if a.get('id'): self.ids.append(a['id'])
              if t=='script' and a.get('src') and not a['src'].startswith(('http','//')):
                if not Path(a['src']).exists(): self.errors.append('Missing script '+a['src'])
              if t=='link' and a.get('rel')=='stylesheet':
                if not Path(a.get('href','')).exists(): self.errors.append('Missing stylesheet '+a.get('href',''))
          p=Audit();p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup:p.errors.append('Duplicate IDs: '+str(dup))
          if p.tags.count('html')!=1 or p.tags.count('main')!=1 or p.tags.count('canvas')<1:p.errors.append('Required document landmarks missing')
          if not re.search(r'<html[^>]+lang=',html):p.errors.append('Language attribute missing')
          if not re.search(r'<title>[^<]+</title>',html):p.errors.append('Document title missing')
          if not re.search(r'viewport',html):p.errors.append('Viewport meta missing')
          if p.errors:raise SystemExit('HTML audit failed: '+'; '.join(p.errors))
          print('HTML audit passed:',len(p.ids),'IDs')
          PY
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/armor.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('styles/cinematic.css').read_text()
          depth=0; quote=None; comment=False; i=0
          while i<len(css):
            if comment:
              if css.startswith('*/',i):comment=False;i+=2;continue
              i+=1;continue
            if quote:
              if css[i]=='\\':i+=2;continue
              if css[i]==quote:quote=None
              i+=1;continue
            if css.startswith('/*',i):comment=True;i+=2;continue
            if css[i] in ('"',"'"):quote=css[i];i+=1;continue
            if css[i]=='{':depth+=1
            elif css[i]=='}':
              depth-=1
              if depth<0:raise SystemExit('CSS unmatched closing brace')
            i+=1
          if depth or quote or comment:raise SystemExit('CSS balance invalid')
          print('CSS structural check passed')
          PY
          npx --yes prettier@3.5.3 --parser html --check index.html
          npx --yes prettier@3.5.3 --parser css --check styles/cinematic.css
          npx --yes prettier@3.5.3 --parser babel --check src/main.js src/armor.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: cinematic-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: cinematic-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live deployment matches source
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --compressed --max-time 20 --output "$RUNNER_TEMP/live-index.html" --write-out '%{http_code}' "$PAGE_URL" || true)"
            if [ "$status" = "200" ]; then
              actual="$(sha256sum "$RUNNER_TEMP/live-index.html" | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then echo "Pages deployment verified: HTTP 200 and source SHA matched.";exit 0;fi
              echo "Attempt $attempt: HTTP 200 but SHA mismatch ($actual != $expected)."
            else echo "Attempt $attempt: HTTP $status; retrying.";fi
            sleep 10
          done
          echo "Live deployment verification failed."
          exit 1
