name: Deploy JARVIS Room Storefront
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate workflow
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/pages.yml
      - name: Static validation
        run: |
          python3 scripts/validate_site.py
          node --check src/room.js
          node --check scripts/runtime_smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: HTTP smoke
        run: |
          test -s index.html
          grep -q 'id="world"' index.html
          grep -q 'ENTER' index.html
          test -s favicon.svg
          test -s styles/room.css
          grep -q 'function buildArchitecture' src/room.js
          echo "Static smoke passed: room HTML, UI, CSS, and runtime files are present."
      - name: Stage clean website artifact
        run: |
          rm -rf _site
          mkdir -p _site/styles _site/src
          cp index.html _site/
          cp favicon.svg _site/
          cp .nojekyll _site/
          cp styles/room.css _site/styles/
          cp src/room.js _site/src/
          test -s _site/index.html
          test -s _site/styles/room.css
          test -s _site/src/room.js
          find _site -type f -print
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify live deployment
        run: |
          curl -fsSL "${{ steps.deployment.outputs.page_url }}" -o "$RUNNER_TEMP/live.html"
          grep -q 'ENTER THE ROOM' "$RUNNER_TEMP/live.html"
          grep -q 'src/room.js' "$RUNNER_TEMP/live.html"
          curl -fsSL "${{ steps.deployment.outputs.page_url }}src/room.js" -o "$RUNNER_TEMP/live-room.js"
          node --check "$RUNNER_TEMP/live-room.js"
