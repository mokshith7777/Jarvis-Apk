name: Deploy JARVIS Cinematic Phase 1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate workflow
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/pages.yml
      - name: Validate Phase 1 files and HTML references
        run: |
          test -s index.html
          test -s styles/cinematic.css
          test -s src/main.js
          test -s src/armor.js
          test -s .nojekyll
          grep -q 'cinematic-world' index.html
          grep -q 'importmap' index.html
          grep -q 'ScrollTrigger' src/main.js
          grep -q 'Lenis' src/main.js
          grep -q 'createArmor' src/armor.js
          grep -q 'setExploded' src/armor.js
          grep -q 'ARC_REACTOR_ASSEMBLY' src/armor.js
          grep -q 'loadArmor' src/main.js
          grep -q 'KTX2Loader' src/main.js
          grep -q 'DRACOLoader' src/main.js
          grep -q 'UnrealBloomPass' src/main.js
          grep -q 'BokehPass' src/main.js
          grep -q 'prefers-reduced-motion' styles/cinematic.css
          grep -q '<main>' index.html
          grep -q '<title>' index.html
          grep -q 'viewport' index.html
          grep -q './styles/cinematic.css' index.html
          grep -q './src/main.js' index.html
      - name: Syntax checks
        run: |
          node --input-type=module --check < src/main.js
          node --input-type=module --check < src/armor.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('styles/cinematic.css').read_text()
          depth=0; quote=None; comment=False; i=0
          while i<len(css):
            if comment:
              if css.startswith('*/',i):comment=False;i+=2;continue
              i+=1;continue
            if quote:
              if css[i]=='\\':i+=2;continue
              if css[i]==quote:quote=None
              i+=1;continue
            if css.startswith('/*',i):comment=True;i+=2;continue
            if css[i] in ('"',"'"):quote=css[i];i+=1;continue
            if css[i]=='{':depth+=1
            elif css[i]=='}':
              depth-=1
              if depth<0:raise SystemExit('CSS unmatched closing brace')
            i+=1
          if depth or quote or comment:raise SystemExit('CSS balance invalid')
          print('CSS structural check passed')
          PY
          cp index.html "$RUNNER_TEMP/index-parse.html"
          npx --yes prettier@3.5.3 --parser html --write "$RUNNER_TEMP/index-parse.html"
          cp styles/cinematic.css "$RUNNER_TEMP/css-parse.css"
          npx --yes prettier@3.5.3 --parser css --write "$RUNNER_TEMP/css-parse.css"
          cp src/main.js "$RUNNER_TEMP/main-parse.js"
          cp src/armor.js "$RUNNER_TEMP/armor-parse.js"
          npx --yes prettier@3.5.3 --parser babel --write "$RUNNER_TEMP/main-parse.js" "$RUNNER_TEMP/armor-parse.js"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: cinematic-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: cinematic-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live deployment matches source
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --compressed --max-time 20 --output "$RUNNER_TEMP/live-index.html" --write-out '%{http_code}' "$PAGE_URL" || true)"
            if [ "$status" = "200" ]; then
              actual="$(sha256sum "$RUNNER_TEMP/live-index.html" | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then echo "Pages deployment verified: HTTP 200 and source SHA matched.";exit 0;fi
              echo "Attempt $attempt: HTTP 200 but SHA mismatch ($actual != $expected)."
            else echo "Attempt $attempt: HTTP $status; retrying.";fi
            sleep 10
          done
          echo "Live deployment verification failed."
          exit 1
