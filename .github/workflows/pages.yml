name: Deploy Immersive Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install dependencies
        run: npm install
      - name: Validate
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          node --check src/room.js
          test -s dist/index.html
          grep -q 'world' dist/index.html
          if grep -R -E 'cdn.jsdelivr.net|unpkg.com|esm.sh' src dist; then exit 1; fi
          if grep -q 'bottom-nav' index.html; then exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@0ca16172ca884f0a37117fed41734f29784cc980
        with:
          path: dist
  deploy:
    needs: build-test-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify deployment response
        run: |
          curl -fsSL "${{ steps.deployment.outputs.page_url }}" -o "$RUNNER_TEMP/live.html"
          grep -q 'world' "$RUNNER_TEMP/live.html"
