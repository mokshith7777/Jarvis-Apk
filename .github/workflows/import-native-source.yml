name: Import JARVIS Alpha native source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-native-source.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and validate source archive
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_36w07ZcBWsdrI99AHcLOA9Jldy5/40ac6c57-2701-45d6-9ab5-f78a7d441668.zip" \
            -o "${RUNNER_TEMP}/jarvis-alpha.zip"
          unzip -t "${RUNNER_TEMP}/jarvis-alpha.zip"
          mkdir -p "${RUNNER_TEMP}/extract"
          unzip -q "${RUNNER_TEMP}/jarvis-alpha.zip" -d "${RUNNER_TEMP}/extract"
          test -d "${RUNNER_TEMP}/extract/jarvis-alpha"
          test -f "${RUNNER_TEMP}/extract/jarvis-alpha/.github/workflows/build-apk.yml"
      - name: Import project files without workflow permissions
        run: |
          set -euo pipefail
          rsync -a --exclude='.github/workflows/' "${RUNNER_TEMP}/extract/jarvis-alpha/" ./
          git status --short
      - name: Commit and push source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy JARVIS Alpha native Kotlin/Compose project"
          git push origin main
      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mokshith7777/Jarvis-Apk/actions/workflows/build-apk.yml/dispatches" \
            -d '{"ref":"main"}'
